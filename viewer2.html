<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DP3HN6DMXQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DP3HN6DMXQ');
  </script>

  <style>
    .controls {
      margin: 20px 0;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .control-group {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .audio-modes {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 10px;
    }
    .controls label { font-weight: bold; }
    .controls button {
      cursor: pointer;
      padding: 8px 12px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .controls button:hover { background: #e9e9e9; }
    .btn-play { background-color: #e7f3ff !important; border-color: #007bff !important; color: #007bff; font-weight: bold; }
    .btn-stop { background-color: #fff0f0 !important; border-color: #dc3545 !important; color: #dc3545; font-weight: bold; }
    
    #paper {
      background: white;
      padding: 10px;
      margin-top: 20px;
      border-radius: 8px;
    }

    .nav-musicas {
      background: #f8f9fa;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      border: 1px solid #ddd;
    }
    .nav-musicas select {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      min-width: 200px;
      flex: 2;
    }
    .nav-musicas .info-musica {
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
    }
    .nav-musicas .badge {
      background: #007bff;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .nav-musicas button {
      padding: 6px 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .nav-musicas button:hover { background: #0056b3; }
    .nav-musicas .compositor-info {
      color: #888;
      font-size: 0.8rem;
      margin-left: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html" style="text-decoration: none; font-weight: bold;">← Voltar para o Acervo</a>
</nav>

<main>

  <!-- Navegação entre músicas do arquivo -->
  <div class="nav-musicas" id="navMusicas" style="display:none;">
    <span class="badge" id="totalMusicas">0</span>
    <select id="listaMusicas" size="1"></select>
    <button id="btnAnterior" title="Música anterior">◀</button>
    <button id="btnProximo" title="Próxima música">▶</button>
    <span class="info-musica" id="infoMusicaAtual"></span>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Andamento (BPM):</label>
      <input type="number" id="tempo" value="100" min="40" max="240" style="width: 60px; padding: 5px;">
      <label style="margin-left:20px;">Transposição:</label>
      <button id="down">−</button>
      <span id="transposeValue" style="font-size: 1.2em; min-width: 20px; text-align: center;">0</span>
      <button id="up">+</button>
    </div>
    <div class="control-group audio-modes">
      <label>Tocar:</label>
      <button class="btn-play" id="play-all">Play</button>
      <button id="play-chords">Só Acordes</button>
      <button id="play-melodies">M1 + M2</button>
      <button id="play-v1">Melodia 1</button>
      <button id="play-v2">Melodia 2</button>
      <button class="btn-stop" id="stop">⏹️ Parar</button>
    </div>
  </div>

  <div id="paper"></div>

</main>

<script>
// ============================================================
// 1. VARIÁVEIS GLOBAIS
// ============================================================
let musicas = [];
let musicaSelecionada = 0;
let visualObj = null;
let synthControl = null;
let transposeValue = 0;
let audioContext = null;

// ============================================================
// 2. FUNÇÕES AUXILIARES
// ============================================================
function extrairCampo(bloco, campo) {
  const regex = new RegExp('^' + campo + ':(.*)$', 'm');
  const match = bloco.match(regex);
  return match ? match[1].trim() : '';
}

function limparTitulo(x, titulo) {
  const padrao = new RegExp('^' + x.padStart(3, '0') + '\\s*[-–]\\s*');
  const padraoSemZero = new RegExp('^' + x + '\\s*[-–]\\s*');
  let limpo = titulo;
  if (padrao.test(titulo)) limpo = titulo.replace(padrao, '');
  else if (padraoSemZero.test(titulo)) limpo = titulo.replace(padraoSemZero, '');
  return limpo;
}

// ============================================================
// 3. EXTRAIR MÚSICAS DO ARQUIVO ABC
// ============================================================
function extrairMusicas(texto) {
  const blocos = texto.split(/\n(?=X:\d+)/);
  const lista = [];
  blocos.forEach(bloco => {
    const x = extrairCampo(bloco, 'X');
    if (!x) return;
    const tituloRaw = extrairCampo(bloco, 'T') || `Música ${x}`;
    const compositor = extrairCampo(bloco, 'C') || 
                       extrairCampo(bloco, 'O') || 
                       extrairCampo(bloco, 'S') || 
                       'Desconhecido';
    const tituloLimpo = limparTitulo(x, tituloRaw);
    lista.push({
      x: x,
      titulo: `${x} - ${tituloLimpo}`,
      tituloLimpo: tituloLimpo,
      compositor: compositor,
      codigo: bloco.trim()
    });
  });
  lista.sort((a, b) => parseInt(a.x, 10) - parseInt(b.x, 10));
  return lista;
}

// ============================================================
// 4. RENDERIZAR UMA MÚSICA ESPECÍFICA
// ============================================================
function renderizarMusica(indice) {
  if (!musicas.length || indice < 0 || indice >= musicas.length) return;
  musicaSelecionada = indice;
  const musica = musicas[indice];
  const bpm = document.getElementById("tempo").value;

  let codigo = musica.codigo;

  // Verifica se já existe um campo Q: neste bloco
  const hasQ = /^Q:.*/m.test(codigo);

  if (!hasQ) {
    // Se NÃO tem Q:, insere com o BPM atual
    codigo = codigo.replace(/^Q:.*$/gm, "");
    codigo = codigo.replace(/^\s*[\r\n]/gm, "");

    const kMatch = codigo.match(/^(K:.*)$/m);
    if (kMatch) {
      codigo = codigo.replace(/^(K:.*)$/m, `$1\nQ:${bpm}`);
    } else {
      const tMatch = codigo.match(/^(T:.*)$/m);
      if (tMatch) {
        codigo = codigo.replace(/^(T:.*)$/m, `$1\nQ:${bpm}`);
      } else {
        codigo = `Q:${bpm}\n` + codigo;
      }
    }
  }
  // Se já tem Q:, mantém o código original (não modifica)

  // Renderiza
  const paperDiv = document.getElementById("paper");
  paperDiv.innerHTML = "";

  const visual = ABCJS.renderAbc("paper", codigo, {
    responsive: "resize",
    visualTranspose: transposeValue
  });

  visualObj = visual && visual.length > 0 ? visual[0] : null;

  document.getElementById("infoMusicaAtual").innerHTML = 
    `${musica.titulo} <span class="compositor-info">(${musica.compositor})</span>`;
  document.getElementById("listaMusicas").value = indice;

  stop();
}

// ============================================================
// 5. POPULAR SELECT
// ============================================================
function popularSelect(selecionarNum = null) {
  const select = document.getElementById("listaMusicas");
  select.innerHTML = "";
  
  musicas.forEach((m) => {
    const option = document.createElement("option");
    option.value = musicas.indexOf(m);
    option.textContent = `${m.x} - ${m.tituloLimpo} (${m.compositor})`;
    select.appendChild(option);
  });

  if (musicas.length === 0) {
    document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada no arquivo.</p>";
    visualObj = null;
    return;
  }

  let idxSelecionado = 0;
  if (selecionarNum) {
    const encontrado = musicas.findIndex(m => m.x === selecionarNum);
    if (encontrado !== -1) {
      idxSelecionado = encontrado;
    }
  }
  select.selectedIndex = idxSelecionado;
  renderizarMusica(Number(select.value));
}

// ============================================================
// 6. CARREGAR ARQUIVO
// ============================================================
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";
const numParam = params.get("num") || null;

fetch(file)
  .then(r => {
    if (!r.ok) throw new Error("Arquivo não encontrado");
    return r.text();
  })
  .then(text => {
    musicas = extrairMusicas(text);
    if (musicas.length === 0) {
      document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada no arquivo.</p>";
      return;
    }

    document.getElementById("navMusicas").style.display = "flex";
    document.getElementById("totalMusicas").textContent = musicas.length;

    popularSelect(numParam);

    document.getElementById("listaMusicas").addEventListener("change", function() {
      renderizarMusica(Number(this.value));
    });

    document.getElementById("btnAnterior").addEventListener("click", function() {
      const atual = Number(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx > 0) {
        const novoIdx = idx - 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

    document.getElementById("btnProximo").addEventListener("click", function() {
      const atual = Number(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx < musicas.length - 1) {
        const novoIdx = idx + 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

  })
  .catch(err => {
    document.getElementById("paper").innerHTML = "<p style='color:red'>Erro ao carregar partitura: " + err.message + "</p>";
  });

// ============================================================
// 7. CONTROLES DE ÁUDIO E TRANSPOSIÇÃO
// ============================================================
function processAndRender() {
  if (musicas.length === 0) return;
  renderizarMusica(musicaSelecionada);
}

document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };
document.getElementById("tempo").oninput = updateUI;

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

async function play(options = {}) {
  if (!visualObj) return;
  stop();
  if (!audioContext) {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
  }
  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();
  try {
    await audioContext.resume();
    await synthControl.init({
      visualObj: visualObj,
      audioContext: audioContext,
      millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
      options: {
        qpm: bpm,
        midiTranspose: transposeValue,
        ...options
      }
    });
    await synthControl.prime();
    synthControl.start();
  } catch (e) {
    console.error("Erro no áudio:", e);
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

document.getElementById("play-all").onclick = () => play({});
document.getElementById("play-chords").onclick = () => play({ voicesOff: true });
document.getElementById("play-melodies").onclick = () => play({ chordsOff: true });
document.getElementById("play-v1").onclick = () => play({ chordsOff: true, voicesOff: [1] });
document.getElementById("play-v2").onclick = () => play({ chordsOff: true, voicesOff: [0] });
document.getElementById("stop").onclick = stop;
</script>

</body>
</html>
