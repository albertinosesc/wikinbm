<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBM - Biblioteca Musical</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    .upload-container {
      margin: 30px auto;
      padding: 25px;
      border: 2px dashed #444;
      border-radius: 12px;
      background: #f9f9f9;
      max-width: 600px;
      text-align: center;
    }
    .file-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      margin-top: 15px;
    }
    .btn-enviar {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .btn-enviar:hover { background: #218838; }
    #statusMessage { 
      margin-top: 15px; 
      font-weight: bold; 
      min-height: 1.2em; 
      padding: 10px;
      border-radius: 5px;
    }
    
    input[type="file"] {
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>NBM - Biblioteca Musical</h1>
  <p>Upload Direto — Prof. Albertino</p>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="musicas.html">Músicas</a>
</nav>

<main>
  <section style="text-align: center;">
    <h2>Painel de Gestão</h2>
    <p>Os arquivos serão salvos na pasta do Google Drive: <strong>wikinbm</strong></p>
  </section>

  <section class="upload-container">
    <h3>📤 Enviar Partitura</h3>
    <form id="uploadForm">
      <div class="file-controls">
        <input type="file" id="fileInput" accept=".abc, .mid, .midi, .xml, .musicxml" required>
        <button type="submit" class="btn-enviar" id="submitBtn">Enviar para o Drive</button>
      </div>
    </form>
    <div id="statusMessage"></div>
  </section>
</main>

<footer>
  <p>© 2026 — Prof: Albertino Moura Barbosa Filho</p>
</footer>

<script>
  // ==========================================
  // CONFIGURAÇÕES GLOBAIS
  // ==========================================
  const CLIENT_ID = '551454830266-lq07qolf14h05rqjijvdq9ojvkpg527h.apps.googleusercontent.com';
  const FOLDER_ID = '1tLbszhAPZb5MT2a5XuYPmT9YcANh_rIF'; 
  const SCOPES = 'https://www.googleapis.com/auth/drive.file';

  let tokenClient;
  let accessToken = null; // Guardará o login enquanto a página estiver aberta

  // Inicializa o sistema do Google
  window.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: '', // definido dinamicamente
    });
  };

  const uploadForm = document.getElementById('uploadForm');
  const statusMessage = document.getElementById('statusMessage');
  const submitBtn = document.getElementById('submitBtn');

  uploadForm.onsubmit = (e) => {
    e.preventDefault();
    const file = document.getElementById('fileInput').files[0];

    if (!file) return;

    // Se já estivermos autenticados nesta sessão, envia direto!
    if (accessToken) {
      executarUpload(file);
    } else {
      statusMessage.textContent = "🔐 Verificando conta...";
      statusMessage.style.color = "blue";
      statusMessage.style.background = "#eef";

      tokenClient.callback = async (response) => {
        if (response.error) {
          statusMessage.textContent = "❌ Erro na autenticação. Tente novamente.";
          statusMessage.style.color = "red";
          return;
        }
        
        accessToken = response.access_token;
        await executarUpload(file);
      };

      // Solicita o token sem forçar a tela de consentimento total (mais rápido)
      tokenClient.requestAccessToken({ prompt: '' });
    }
  };

  async function executarUpload(file) {
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";
    statusMessage.textContent = "📤 Enviando '" + file.name + "'...";
    statusMessage.style.color = "orange";
    statusMessage.style.background = "#fff3cd";

    const metadata = {
      name: file.name,
      mimeType: file.type || 'application/octet-stream',
      parents: [FOLDER_ID] 
    };

    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', file);

    try {
      const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: formData
      });

      if (response.ok) {
        statusMessage.textContent = "✅ " + file.name + " enviado com sucesso!";
        statusMessage.style.color = "green";
        statusMessage.style.background = "#d4edda";
        uploadForm.reset();
      } else {
        const errorData = await response.json();
        console.error("Erro API Drive:", errorData);
        // Se o token expirou (401), limpa para pedir login de novo na próxima
        if(response.status === 401) accessToken = null;
        throw new Error();
      }
    } catch (error) {
      statusMessage.textContent = "❌ Falha no envio. Tente atualizar a página.";
      statusMessage.style.color = "red";
      statusMessage.style.background = "#f8d7da";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar para o Drive";
    }
  }
</script>

</body>
</html>
