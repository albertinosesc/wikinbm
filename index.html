<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBM - Biblioteca Musical</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    .upload-container {
      margin: 30px auto;
      padding: 25px;
      border: 2px dashed #444;
      border-radius: 12px;
      background: #f9f9f9;
      max-width: 600px;
      text-align: center;
    }
    .file-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      margin-top: 15px;
    }
    .btn-enviar {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .btn-enviar:hover { background: #218838; }
    #statusMessage { margin-top: 15px; font-weight: bold; min-height: 1.2em; }
    
    input[type="file"] {
      background: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>NBM - Biblioteca Musical</h1>
  <p>Upload Direto para o Google Drive — Prof. Albertino</p>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="musicas.html">Músicas</a>
</nav>

<main>
  <section style="text-align: center;">
    <h2>Painel de Envio</h2>
    <p>Os arquivos serão salvos na pasta: <strong>Biblioteca NBM</strong></p>
  </section>

  <section class="upload-container">
    <h3>📤 Enviar Arquivo</h3>
    <form id="uploadForm">
      <div class="file-controls">
        <input type="file" id="fileInput" accept=".abc, .mid, .midi, .xml, .musicxml" required>
        
        <button type="submit" class="btn-enviar">Autenticar e Salvar no Drive</button>
      </div>
    </form>
    <div id="statusMessage"></div>
  </section>

  <section style="text-align: center; margin-top: 40px;">
    <a href="musicas.html" style="font-size: 1.1em; font-weight: bold; color: #222;">
      📂 Ver Músicas na Biblioteca →
    </a>
  </section>
</main>

<footer>
  <p>© 2026 — Prof: Albertino Moura Barbosa Filho</p>
</footer>

<script>
  // ==========================================
  // CONFIGURAÇÕES GLOBAIS
  // ==========================================
  const CLIENT_ID = '551454830266-lq07qolf14h05rqjijvdq9ojvkpg527h.apps.googleusercontent.com';
  const FOLDER_ID = '1tLbszhAPZb5MT2a5XuYPmT9YcANh_rIF'; // Sua pasta específica
  const SCOPES = 'https://www.googleapis.com/auth/drive.file';

  let tokenClient;
  let accessToken = null;

  // 1. Inicializa o cliente Google logo no carregamento
  window.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: '', // definido no submit
    });
  };

  const uploadForm = document.getElementById('uploadForm');
  const statusMessage = document.getElementById('statusMessage');

  // 2. Lógica do Formulário
  uploadForm.onsubmit = (e) => {
    e.preventDefault();
    const file = document.getElementById('fileInput').files[0];

    if (!file) return;

    statusMessage.textContent = "🔐 Abrindo autenticação Google...";
    statusMessage.style.color = "blue";

    // Define o que ocorre após o login
    tokenClient.callback = async (response) => {
      if (response.error) {
        statusMessage.textContent = "❌ Autenticação cancelada ou negada.";
        statusMessage.style.color = "red";
        return;
      }
      
      accessToken = response.access_token;
      await executarUpload(file);
    };

    // Abre o pop-up de login do Google
    tokenClient.requestAccessToken({ prompt: 'consent' });
  };

  // 3. Função de Upload Real
  async function executarUpload(file) {
    statusMessage.textContent = "📤 Enviando '" + file.name + "'...";
    statusMessage.style.color = "orange";

    // Metadados incluindo a pasta pai (Parents)
    const metadata = {
      name: file.name,
      mimeType: file.type,
      parents: [FOLDER_ID] 
    };

    const formData = new FormData();
    formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    formData.append('file', file);

    try {
      const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: formData
      });

      if (response.ok) {
        statusMessage.textContent = "✅ Sucesso! Arquivo salvo na pasta do Drive.";
        statusMessage.style.color = "green";
        uploadForm.reset();
      } else {
        const errorData = await response.json();
        console.error("Erro API Drive:", errorData);
        throw new Error();
      }
    } catch (error) {
      statusMessage.textContent = "❌ Erro técnico ao enviar. Verifique o console.";
      statusMessage.style.color = "red";
    }
  }
</script>

</body>
</html>
