<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Playlist – NBM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { text-align: center; color: #2c3e50; }
    nav {
      background: #2c3e50;
      padding: 1rem;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 700px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .panel {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #ddd;
    }
    .panel h3 {
      margin-top: 0;
      color: #2c3e50;
      border-bottom: 2px solid #e67e22;
      padding-bottom: 8px;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-box:focus { border-color: #e67e22; }

    .lista-itens {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .item:hover { background: #fff5ed; }
    .item .titulo { flex: 1; }
    .item .btn-add {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .item .btn-add:hover { background: #1e7e34; }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      background: white;
    }
    .playlist-item .titulo { flex: 1; }
    .playlist-item .btn-remove {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .playlist-item .btn-remove:hover { background: #c82333; }
    .playlist-item .btn-up, .playlist-item .btn-down {
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.8rem;
      margin: 0 2px;
    }
    .playlist-item .btn-up:hover, .playlist-item .btn-down:hover { background: #5a6268; }

    .empty-msg {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    .acoes {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .acoes button {
      padding: 8px 18px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      background: #007bff;
      color: white;
      transition: 0.2s;
    }
    .acoes button:hover { background: #0056b3; }
    .acoes button.verde { background: #28a745; }
    .acoes button.verde:hover { background: #1e7e34; }
    .acoes button.laranja { background: #fd7e14; }
    .acoes button.laranja:hover { background: #e06b0a; }
    .acoes button.vermelho { background: #dc3545; }
    .acoes button.vermelho:hover { background: #c82333; }

    .import-area {
      margin-top: 10px;
      padding: 10px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
    }
    .import-area:hover { background: #f1f1f1; }
    .import-area input[type="file"] {
      display: none;
    }
    .import-area .label {
      display: inline-block;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    .import-area .label:hover { background: #0056b3; }

    .status {
      margin-top: 10px;
      font-weight: bold;
      color: #28a745;
    }
    .badge {
      background: #e67e22;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-left: 8px;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Início</a>
  <a href="musicas.html">Músicas</a>
  <a href="playlist.html">Playlist</a>
  <a href="upload.html">Upload</a>
</nav>

<div class="container">
  <h1>📋 Minha Playlist</h1>

  <div class="grid-2">
    <!-- Painel esquerdo: Acervo + Busca -->
    <div class="panel">
      <h3>📚 Acervo <span class="badge" id="totalAcervo">0</span></h3>
      <input type="text" id="buscaAcervo" class="search-box" placeholder="Buscar no acervo...">
      <div class="lista-itens" id="listaAcervo"></div>
      <div style="margin-top:10px;">
        <button class="btn-add" onclick="adicionarTodosFiltrados()" style="background:#007bff;color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;">➕ Adicionar todos filtrados</button>
      </div>
    </div>

    <!-- Painel direito: Playlist -->
    <div class="panel">
      <h3>🎵 Playlist <span class="badge" id="totalPlaylist">0</span></h3>
      <div class="lista-itens" id="listaPlaylist"></div>
      <div class="acoes">
        <button class="laranja" onclick="limparPlaylist()">🗑️ Limpar</button>
        <button class="verde" onclick="salvarPlaylist()">💾 Salvar no Navegador</button>
        <button class="btn-add" onclick="exportarM3U()">📥 Exportar .m3u</button>
        <button class="btn-add" onclick="exportarJSON()">📥 Exportar .json</button>
      </div>
      <div class="import-area" onclick="document.getElementById('fileInput').click()">
        <span class="label">📂 Importar arquivo (.abc ou .txt)</span>
        <input type="file" id="fileInput" accept=".abc,.txt" multiple>
        <p style="font-size:0.8rem; color:#888; margin:5px 0 0;">Arquivos .abc: extrai títulos; .txt: cada linha é um item</p>
      </div>
      <div id="statusImport" class="status"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. CONFIGURAÇÃO
// ============================================================
const STORAGE_KEY = 'nbm_playlist';
let acervo = [];
let playlist = [];

// ============================================================
// 2. CARREGAR ACERVO (mesmo esquema do musicas.html)
// ============================================================
const arquivosJson = [
  'dados/folclore.json',
  'dados/cantor-cristao.json',
  'dados/evangelicas.json',
  'dados/hinario-ccb.json',
  'dados/enciclopedia_musica.json',
  'dados/metodo_buga.json',
  'dados/outros.json',
  'dados/mpb.json'
];

async function carregarAcervo() {
  try {
    const promessas = arquivosJson.map(url =>
      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`Não encontrado: ${url}`);
          return res.json();
        })
        .catch(() => [])
    );
    const resultados = await Promise.all(promessas);
    acervo = resultados.flat().filter(m => m && m.titulo && m.categoria);
    document.getElementById('totalAcervo').textContent = acervo.length;
    renderizarAcervo('');
  } catch (e) {
    console.error(e);
  }
}

// ============================================================
// 3. PLAYLIST - localStorage
// ============================================================
function carregarPlaylist() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try {
      playlist = JSON.parse(data);
      if (!Array.isArray(playlist)) playlist = [];
    } catch {
      playlist = [];
    }
  } else {
    playlist = [];
  }
  renderizarPlaylist();
}

function salvarPlaylist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(playlist));
  document.getElementById('statusImport').textContent = '✅ Playlist salva no navegador!';
  document.getElementById('statusImport').style.color = '#28a745';
  setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 3000);
}

function limparPlaylist() {
  if (playlist.length === 0) return;
  if (confirm('Deseja limpar toda a playlist?')) {
    playlist = [];
    renderizarPlaylist();
    salvarPlaylist();
  }
}

// ============================================================
// 4. RENDERIZAR ACERVO (com busca)
// ============================================================
function renderizarAcervo(filtro) {
  const container = document.getElementById('listaAcervo');
  const termo = filtro.toLowerCase().trim();
  const filtrados = acervo.filter(m =>
    m.titulo.toLowerCase().includes(termo) ||
    (m.compositor && m.compositor.toLowerCase().includes(termo)) ||
    m.categoria.toLowerCase().includes(termo)
  );

  if (filtrados.length === 0) {
    container.innerHTML = '<div class="empty-msg">Nenhuma música encontrada</div>';
    return;
  }

  container.innerHTML = filtrados.map(m => `
    <div class="item" data-titulo="${m.titulo}" data-path="${m.path}">
      <span class="titulo"><strong>${m.titulo}</strong> <span style="color:#888;font-size:0.8rem;">${m.compositor || ''}</span></span>
      <button class="btn-add" onclick="adicionarItem('${m.titulo}', '${m.path}')">➕</button>
    </div>
  `).join('');
}

// ============================================================
// 5. RENDERIZAR PLAYLIST
// ============================================================
function renderizarPlaylist() {
  const container = document.getElementById('listaPlaylist');
  document.getElementById('totalPlaylist').textContent = playlist.length;

  if (playlist.length === 0) {
    container.innerHTML = '<div class="empty-msg">Nenhuma música na playlist</div>';
    return;
  }

  container.innerHTML = playlist.map((item, index) => `
    <div class="playlist-item" data-index="${index}">
      <span class="titulo"><strong>${item.titulo}</strong> <span style="color:#888;font-size:0.8rem;">${item.path || ''}</span></span>
      <div>
        <button class="btn-up" onclick="moverItem(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn-down" onclick="moverItem(${index}, 1)" ${index === playlist.length-1 ? 'disabled' : ''}>▼</button>
        <button class="btn-remove" onclick="removerItem(${index})">✕</button>
      </div>
    </div>
  `).join('');
}

// ============================================================
// 6. MANIPULAÇÃO DA PLAYLIST
// ============================================================
function adicionarItem(titulo, path) {
  // Evita duplicatas (pode remover se quiser permitir repetição)
  if (playlist.some(item => item.titulo === titulo && item.path === path)) {
    document.getElementById('statusImport').textContent = '⚠️ Música já está na playlist.';
    document.getElementById('statusImport').style.color = '#fd7e14';
    setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 2000);
    return;
  }
  playlist.push({ titulo, path });
  renderizarPlaylist();
  salvarPlaylist();
  document.getElementById('statusImport').textContent = `✅ "${titulo}" adicionado!`;
  document.getElementById('statusImport').style.color = '#28a745';
  setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 1500);
}

function removerItem(index) {
  const removido = playlist[index];
  playlist.splice(index, 1);
  renderizarPlaylist();
  salvarPlaylist();
  document.getElementById('statusImport').textContent = `🗑️ "${removido.titulo}" removido.`;
  document.getElementById('statusImport').style.color = '#dc3545';
  setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 1500);
}

function moverItem(index, direcao) {
  const novoIndex = index + direcao;
  if (novoIndex < 0 || novoIndex >= playlist.length) return;
  const [item] = playlist.splice(index, 1);
  playlist.splice(novoIndex, 0, item);
  renderizarPlaylist();
  salvarPlaylist();
}

function adicionarTodosFiltrados() {
  const busca = document.getElementById('buscaAcervo').value;
  const termo = busca.toLowerCase().trim();
  const filtrados = acervo.filter(m =>
    m.titulo.toLowerCase().includes(termo) ||
    (m.compositor && m.compositor.toLowerCase().includes(termo)) ||
    m.categoria.toLowerCase().includes(termo)
  );
  let adicionados = 0;
  filtrados.forEach(m => {
    if (!playlist.some(p => p.titulo === m.titulo && p.path === m.path)) {
      playlist.push({ titulo: m.titulo, path: m.path });
      adicionados++;
    }
  });
  if (adicionados > 0) {
    renderizarPlaylist();
    salvarPlaylist();
    document.getElementById('statusImport').textContent = `✅ ${adicionados} músicas adicionadas.`;
    document.getElementById('statusImport').style.color = '#28a745';
    setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 2000);
  } else {
    document.getElementById('statusImport').textContent = '⚠️ Nenhuma nova música para adicionar.';
    document.getElementById('statusImport').style.color = '#fd7e14';
    setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 2000);
  }
}

// ============================================================
// 7. IMPORTAR ARQUIVOS (.abc ou .txt)
// ============================================================
document.getElementById('fileInput').addEventListener('change', function(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  let totalItens = 0;
  let promises = [];

  for (let file of files) {
    const reader = new FileReader();
    const promise = new Promise((resolve) => {
      reader.onload = function(ev) {
        const content = ev.target.result;
        const nomeArquivo = file.name;

        if (nomeArquivo.toLowerCase().endsWith('.abc')) {
          // Extrai todos os títulos (T:) do arquivo ABC
          const titulos = extrairTitulosABC(content);
          titulos.forEach(t => {
            // Verifica duplicata
            if (!playlist.some(p => p.titulo === t)) {
              playlist.push({ titulo: t, path: nomeArquivo });
              totalItens++;
            }
          });
        } else if (nomeArquivo.toLowerCase().endsWith('.txt')) {
          // Cada linha é um item
          const linhas = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          linhas.forEach(t => {
            if (!playlist.some(p => p.titulo === t)) {
              playlist.push({ titulo: t, path: nomeArquivo });
              totalItens++;
            }
          });
        } else {
          alert(`Arquivo não suportado: ${nomeArquivo}`);
        }
        resolve();
      };
      reader.readAsText(file);
    });
    promises.push(promise);
  }

  Promise.all(promises).then(() => {
    if (totalItens > 0) {
      renderizarPlaylist();
      salvarPlaylist();
      document.getElementById('statusImport').textContent = `✅ ${totalItens} itens importados.`;
      document.getElementById('statusImport').style.color = '#28a745';
    } else {
      document.getElementById('statusImport').textContent = '⚠️ Nenhum item novo importado.';
      document.getElementById('statusImport').style.color = '#fd7e14';
    }
    setTimeout(() => { document.getElementById('statusImport').textContent = ''; }, 3000);
    // Limpa o input para permitir reimportar o mesmo arquivo
    document.getElementById('fileInput').value = '';
  });
});

function extrairTitulosABC(texto) {
  const titulos = [];
  const blocos = texto.split(/\n(?=X:\d+)/);
  blocos.forEach(bloco => {
    const match = bloco.match(/^T:(.*)$/m);
    if (match) {
      titulos.push(match[1].trim());
    }
  });
  return titulos;
}

// ============================================================
// 8. EXPORTAR PLAYLIST
// ============================================================
function exportarM3U() {
  if (playlist.length === 0) {
    alert('Playlist vazia. Adicione músicas primeiro.');
    return;
  }
  let conteudo = '#EXTM3U\n';
  playlist.forEach(item => {
    // Tenta montar um caminho razoável: se tiver path, usa; senão, usa o título
    const path = item.path || `${item.titulo}.abc`;
    conteudo += `#EXTINF:-1,${item.titulo}\n${path}\n`;
  });
  baixarArquivo(conteudo, 'playlist.m3u', 'audio/x-mpegurl');
}

function exportarJSON() {
  if (playlist.length === 0) {
    alert('Playlist vazia. Adicione músicas primeiro.');
    return;
  }
  const json = JSON.stringify(playlist, null, 2);
  baixarArquivo(json, 'playlist.json', 'application/json');
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// 9. EVENTOS DE BUSCA
// ============================================================
document.getElementById('buscaAcervo').addEventListener('input', function() {
  renderizarAcervo(this.value);
});

// ============================================================
// 10. INICIALIZAÇÃO
// ============================================================
window.onload = function() {
  carregarAcervo();
  carregarPlaylist();
};
</script>

</body>
</html>
