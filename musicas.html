<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎶 Acervo Musical NBM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-box {
      margin: 20px 0;
      padding: 10px;
      width: 100%;
      max-width: 400px;
      border: 2px solid #2c3e50;
      border-radius: 8px;
    }
    .categoria-section { margin-bottom: 30px; }
    .lista-musicas { list-style: none; padding: 0; }
    .lista-musicas li { margin: 8px 0; }
    .lista-musicas a { 
      text-decoration: none; 
      color: #3498db; 
      font-weight: 500;
    }
    .lista-musicas a:hover { color: #e67e22; }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h1>🎶 Músicas Disponíveis</h1>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="upload.html">Fazer Upload</a>
</nav>

<main class="container">
  <input type="text" id="filtro" class="search-box" placeholder="🔎 Pesquisar música ou compositor...">

  <div id="acervo">
    <section class="categoria-section">
      <h3>Piano</h3>
      <ul class="lista-musicas">
        <li><a href="viewer.html?file=musicas/asa-branca.abc">Asa Branca</a></li>
        <li><a href="viewer.html?file=musicas/beto.abc">Beto</a></li>
      </ul>
    </section>

    <section class="categoria-section">
      <h3>Melodia</h3>
      <ul class="lista-musicas">
        <li><a href="viewer.html?file=musicas/melodia/1972 - Atirei o Pau no Gato.abc">1972 - Atirei o Pau no Gato</a></li>
      </ul>
    </section>
  </div>
</main>

<script>
  // Lógica de busca em tempo real
  document.getElementById('filtro').addEventListener('input', function() {
    let termo = this.value.toLowerCase();
    let itens = document.querySelectorAll('.lista-musicas li');
    
    itens.forEach(item => {
      let texto = item.textContent.toLowerCase();
      item.classList.toggle('hidden', !texto.includes(termo));
    });
  });
</script>

</body>
</html>
