<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acervo Digital NBM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-container { padding: 20px; background: #2c3e50; text-align: center; }
    #busca { width: 80%; max-width: 500px; padding: 12px; border-radius: 20px; border: none; }
    .categoria-bloco { margin: 20px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .musica-link { display: block; padding: 8px; color: #3498db; text-decoration: none; border-bottom: 1px solid #f0f0f0; }
    .musica-link:hover { background: #f9f9f9; color: #e67e22; }
    .contador { color: #bdc3c7; font-size: 0.9rem; margin-top: 10px; }
  </style>
</head>
<body>

<nav><a href="index.html">Início</a></nav>

<div class="search-container">
  <h1 style="color: white;">🎶 Biblioteca ABC</h1>
  <input type="text" id="busca" placeholder="Pesquisar entre 25.000 músicas...">
  <div id="contagem" class="contador">Carregando acervo...</div>
</div>

<div id="lista-categorias">
  </div>

<script>
  let acervoCompleto = [];

  // Função para carregar o JSON
  async function carregarAcervo() {
    try {
      const response = await fetch('musicas.json');
      acervoCompleto = await response.json();
      renderizarMusicas(acervoCompleto);
      document.getElementById('contagem').innerText = `${acervoCompleto.length} músicas encontradas`;
    } catch (e) {
      console.error("Erro ao carregar JSON:", e);
    }
  }

  function renderizarMusicas(dados) {
    const container = document.getElementById('lista-categorias');
    container.innerHTML = '';

    // Agrupa por categoria
    const categorias = [...new Set(dados.map(m => m.categoria))];

    categorias.forEach(cat => {
      const section = document.createElement('section');
      section.className = 'categoria-bloco';
      section.innerHTML = `<h3>${cat}</h3>`;
      
      const musicasDaCat = dados.filter(m => m.categoria === cat);
      musicasDaCat.forEach(m => {
        const link = document.createElement('a');
        link.className = 'musica-link';
        link.href = `viewer.html?file=${m.path}`;
        link.innerHTML = `<strong>${m.titulo}</strong> - <small>${m.compositor}</small>`;
        section.appendChild(link);
      });
      
      container.appendChild(section);
    });
  }

  // Busca em tempo real
  document.getElementById('busca').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase();
    const filtrados = acervoCompleto.filter(m => 
      m.titulo.toLowerCase().includes(termo) || 
      m.compositor.toLowerCase().includes(termo)
    );
    renderizarMusicas(filtrados);
  });

  window.onload = carregarAcervo;
</script>
</body>
</html>
