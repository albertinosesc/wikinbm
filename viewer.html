<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .controls {
      margin: 15px 0;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .controls button { cursor: pointer; padding: 8px 12px; }
    #paper { margin-top: 20px; background: white; }
    .transpose-control { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html">← Voltar</a>
</nav>

<main>
  <div class="controls">
    <div>
      <button id="play">▶️ Tocar</button>
      <button id="stop">⏹️ Parar</button>
    </div>

    <label>
      BPM:
      <input type="number" id="tempo" value="100" min="40" max="240" step="5">
    </label>

    <div class="transpose-control">
      <span>Tom:</span>
      <button id="down">−</button>
      <strong id="transposeValue">0</strong>
      <button id="up">+</button>
    </div>
  </div>

  <div id="paper"></div>
</main>

<script>
let abcRawText = ""; // Texto original do arquivo .abc
let visualObj = null;
let synthControl = null;
let transposeValue = 0;

// 1. Carregar o arquivo
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc"; // Fallback para teste

fetch(file)
  .then(r => r.text())
  .then(text => {
    abcRawText = text;
    renderScore();
  })
  .catch(err => {
    document.getElementById("paper").innerHTML = "<p>Erro ao carregar a música.</p>";
  });

// 2. Função de Renderização (Crucial para o Transpose)
function renderScore() {
  // O transpose no ABCJS altera a visualização das notas
  visualObj = ABCJS.renderAbc("paper", abcRawText, {
    responsive: "resize",
    visualTranspose: transposeValue, // Transpõe visualmente
    format: {
      gchordfont: "Verdana 12"
    }
  })[0];

  // Se estiver tocando, paramos para resetar o buffer de áudio com o novo tom/tempo
  stop();
}

// 3. Função de Áudio (Crucial para o Tempo/BPM)
async function play() {
  if (!abcRawText) return;

  // Se o contexto de áudio do navegador estiver suspenso (comum em browsers modernos)
  if (ABCJS.synth.supportsAudio()) {
    stop(); // Para qualquer execução anterior

    const bpm = parseInt(document.getElementById("tempo").value, 10);
    
    // Criamos o controlador de áudio
    synthControl = new ABCJS.synth.CreateSynth();
    
    try {
      await synthControl.init({
        visualObj: visualObj, // Usa o objeto já transposto
        options: {
          millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
          // O segredo do tempo está aqui:
          qpm: bpm, 
        }
      });

      await synthControl.prime();
      synthControl.start();
    } catch (error) {
      console.warn("Erro no sintetizador:", error);
    }
  } else {
    alert("Audio não suportado neste navegador.");
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

// Eventos
document.getElementById("play").onclick = play;
document.getElementById("stop").onclick = stop;

document.getElementById("up").onclick = () => {
  transposeValue++;
  updateTransposeDisplay();
};

document.getElementById("down").onclick = () => {
  transposeValue--;
  updateTransposeDisplay();
};

function updateTransposeDisplay() {
  document.getElementById("transposeValue").textContent = transposeValue;
  renderScore(); // Re-renderiza a partitura com o novo tom
}

// Listener opcional: se mudar o BPM enquanto toca, ele reinicia para aplicar
document.getElementById("tempo").onchange = () => {
    if (synthControl) play(); 
};
</script>

</body>
</html>
