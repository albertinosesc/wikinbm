<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <style>
    /* 1. Ajuste para largura total */
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    main {
      width: 100%;
      max-width: 100%; /* Remove qualquer limitação de largura */
      padding: 0;
    }

  #paper {
  width: 100%;
  background: white;
  padding: 1cm; /* Adiciona a margem interna de 1cm em todos os lados */
  box-sizing: border-box; /* Garante que o padding não aumente o tamanho total da div */
  margin-top: 20px;
  border-radius: 8px;
}

@media print {
  #paper {
    padding: 0; /* Na impressão, deixamos a margem por conta da configuração da impressora */
  }
}

    /* Estilos dos controles */
    .controls {
      margin: 10px;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .control-group {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .audio-modes {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 10px;
    }

    .controls button {
      cursor: pointer;
      padding: 8px 12px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
    }

    .btn-pdf {
      background-color: #28a745 !important;
      color: white !important;
      border-color: #1e7e34 !important;
      font-weight: bold;
    }

    .btn-play { background-color: #e7f3ff !important; border-color: #007bff !important; color: #007bff; font-weight: bold; }
    .btn-stop { background-color: #fff0f0 !important; border-color: #dc3545 !important; color: #dc3545; font-weight: bold; }

    /* 2. REGRAS PARA O PDF (IMPRESSÃO) */
  
      body, main, #paper {
        margin: 0;
        padding: 0;
        width: 100%;
      }
      #paper svg {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html" style="margin-left: 10px; text-decoration: none; font-weight: bold;">← Voltar</a>
</nav>

<main>
  <div class="controls">
    <div class="control-group">
      <label>Andamento (BPM):</label>
      <input type="number" id="tempo" value="100" min="40" max="240" style="width: 60px; padding: 5px;">

      <label style="margin-left:20px;">Transposição:</label>
      <button id="down">−</button>
      <span id="transposeValue" style="font-size: 1.2em; font-weight: bold;">0</span>
      <button id="up">+</button>

      <button class="btn-pdf" id="download-pdf" style="margin-left: auto;">📄 Baixar PDF / Imprimir</button>
    </div>

    <div class="control-group audio-modes">
      <label>Tocar:</label>
      <button class="btn-play" id="play-all">Play</button>
      <button id="play-chords">Só Acordes</button>
      <button id="play-melodies">M1 + M2</button>
      <button id="play-v1">Melodia 1</button>
      <button id="play-v2">Melodia 2</button>
      <button class="btn-stop" id="stop">⏹️ Parar</button>
    </div>
  </div>

  <div id="paper"></div>
</main>

<script>
let abcRawText = ""; 
let visualObj = null;
let synthControl = null;
let transposeValue = 0;
let audioContext = null;

const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";

fetch(file)
  .then(r => {
    if(!r.ok) throw new Error("Arquivo não encontrado");
    return r.text();
  })
  .then(text => {
    abcRawText = text;
    processAndRender();
  });

function processAndRender() {
  const bpm = document.getElementById("tempo").value;
  let modifiedAbc = abcRawText.replace(/^Q:.*\n?/gm, ""); 
  modifiedAbc = modifiedAbc.replace(/(K:.*\n)/, `$1Q:${bpm}\n`);

  const paperDiv = document.getElementById("paper");
  
  // Calculamos a largura da div e subtraímos o equivalente a 2cm (margem esquerda + direita)
  // 1cm é aproximadamente 38 pixels em telas padrão
  const margemPixels = 76; 
  const larguraReal = paperDiv.clientWidth - margemPixels;

  visualObj = ABCJS.renderAbc("paper", modifiedAbc, {
    responsive: "resize",
    visualTranspose: transposeValue,
    staffwidth: larguraReal, // Agora ele desenha respeitando a margem
    wrap: { minSpacing: 1.8, maxSpacing: 2.5 },
    paddingtop: 0,
    paddingbottom: 30,
    paddingright: 0,
    paddingleft: 0
  })[0];

  stop();
}

async function play(options = {}) {
  if (!visualObj) return;
  stop();
  if (!audioContext) {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
  }
  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();
  try {
    await audioContext.resume();
    await synthControl.init({
      visualObj: visualObj,
      audioContext: audioContext,
      millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
      options: { qpm: bpm, midiTranspose: transposeValue, ...options }
    });
    await synthControl.prime();
    synthControl.start();
  } catch (e) { console.error(e); }
}

function stop() { if (synthControl) { synthControl.stop(); synthControl = null; } }

document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };
document.getElementById("tempo").oninput = updateUI;
document.getElementById("download-pdf").onclick = () => { window.print(); };

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

document.getElementById("play-all").onclick = () => play({});
document.getElementById("play-chords").onclick = () => play({ voicesOff: true });
document.getElementById("play-melodies").onclick = () => play({ chordsOff: true });
document.getElementById("play-v1").onclick = () => play({ chordsOff: true, voicesOff: [1] });
document.getElementById("play-v2").onclick = () => play({ chordsOff: true, voicesOff: [0] });
document.getElementById("stop").onclick = stop;

// Re-renderiza se a janela mudar de tamanho para manter a largura total
window.onresize = processAndRender;

</script>
</body>
</html>
