<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <style>
    .controls {
      margin: 20px 0;
      padding: 10px;
      background: #eee;
      border-radius: 6px;
    }

    .controls label {
      margin-right: 10px;
      font-weight: bold;
    }

    .controls button,
    .controls input {
      margin-right: 10px;
      padding: 5px 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html">← Voltar</a>
</nav>

<main>

  <div class="controls">
    <button id="play">▶️ Tocar</button>
    <button id="stop">⏹️ Parar</button>

    <label>
      Andamento (BPM):
      <input type="number" id="tempo" value="100" min="40" max="240">
    </label>

    <label>
      Transposição:
      <button id="down">−</button>
      <span id="transposeValue">0</span>
      <button id="up">+</button>
    </label>
  </div>

  <div id="paper"></div>

</main>

<script>
let originalAbc = "";
let currentTranspose = 0;
let visualObj = null;
let synth = null;

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(file)
  .then(res => res.text())
  .then(abc => {
    originalAbc = abc;
    render();
  });

function render() {
  document.getElementById("paper").innerHTML = "";

  const renderOptions = {
    transpose: currentTranspose
  };

  visualObj = ABCJS.renderAbc("paper", originalAbc, renderOptions)[0];
}

document.getElementById("play").onclick = async () => {
  if (!visualObj) return;

  if (synth) synth.stop();

  synth = new ABCJS.synth.CreateSynth();

  const tempo = parseInt(document.getElementById("tempo").value, 10);

  await synth.init({
    visualObj,
    options: {
      tempo: tempo
    }
  });

  await synth.prime();
  synth.start();
};

document.getElementById("stop").onclick = () => {
  if (synth) synth.stop();
};

document.getElementById("up").onclick = () => {
  currentTranspose++;
  document.getElementById("transposeValue").textContent = currentTranspose;
  render();
};

document.getElementById("down").onclick = () => {
  currentTranspose--;
  document.getElementById("transposeValue").textContent = currentTranspose;
  render();
};
</script>

</body>
</html>
