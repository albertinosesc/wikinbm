<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DP3HN6DMXQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DP3HN6DMXQ');
  </script>

  <style>
    .controls {
      margin: 20px 0;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .control-group {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .audio-modes {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 10px;
    }

    .controls label {
      font-weight: bold;
    }

    .controls button {
      cursor: pointer;
      padding: 8px 12px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .controls button:hover {
      background: #e9e9e9;
    }

    .btn-play { background-color: #e7f3ff !important; border-color: #007bff !important; color: #007bff; font-weight: bold; }
    .btn-stop { background-color: #fff0f0 !important; border-color: #dc3545 !important; color: #dc3545; font-weight: bold; }
    
    #paper {
      background: white;
      padding: 10px;
      margin-top: 20px;
      border-radius: 8px;
    }

    /* Estilos para a navegação de músicas */
    .nav-musicas {
      background: #f8f9fa;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      border: 1px solid #ddd;
    }
    .nav-musicas select {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      min-width: 200px;
      flex: 1;
    }
    .nav-musicas input[type="text"] {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      min-width: 150px;
      flex: 1;
    }
    .nav-musicas .info-musica {
      font-size: 0.9rem;
      color: #555;
      white-space: nowrap;
    }
    .nav-musicas .badge {
      background: #007bff;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .nav-musicas button {
      padding: 6px 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-musicas button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa2</h1>
</header>

<nav>
  <a href="musicas.html" style="text-decoration: none; font-weight: bold;">← Voltar para o Acervo</a>
</nav>

<main>

  <!-- Navegação entre músicas do arquivo -->
  <div class="nav-musicas" id="navMusicas" style="display:none;">
    <span class="badge" id="totalMusicas">0</span>
    <input type="text" id="buscaMusica" placeholder="Buscar por número ou título...">
    <select id="listaMusicas" size="1"></select>
    <button id="btnAnterior" title="Música anterior">◀</button>
    <button id="btnProximo" title="Próxima música">▶</button>
    <span class="info-musica" id="infoMusicaAtual"></span>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Andamento (BPM):</label>
      <input type="number" id="tempo" value="100" min="40" max="240" style="width: 60px; padding: 5px;">

      <label style="margin-left:20px;">Transposição:</label>
      <button id="down">−</button>
      <span id="transposeValue" style="font-size: 1.2em; min-width: 20px; text-align: center;">0</span>
      <button id="up">+</button>
    </div>

    <div class="control-group audio-modes">
      <label>Tocar:</label>
      <button class="btn-play" id="play-all">Play</button>
      <button id="play-chords">Só Acordes</button>
      <button id="play-melodies">M1 + M2</button>
      <button id="play-v1">Melodia 1</button>
      <button id="play-v2">Melodia 2</button>
      <button class="btn-stop" id="stop">⏹️ Parar</button>
    </div>
  </div>

  <div id="paper"></div>

</main>

<script>
// ============================================================
// 1. VARIÁVEIS GLOBAIS
// ============================================================
let abcRawText = "";          // texto completo do arquivo ABC
let musicas = [];             // array de objetos { x, titulo, codigo }
let musicaSelecionada = 0;    // índice atual
let visualObj = null;
let synthControl = null;
let transposeValue = 0;
let audioContext = null;

// ============================================================
// 2. EXTRAIR MÚSICAS DO ARQUIVO ABC
// ============================================================
function extrairMusicas(texto) {
  // Divide o texto em blocos começando com "X:"
  const blocos = texto.split(/\n(?=X:\d+)/);
  const lista = [];
  blocos.forEach(bloco => {
    const xMatch = bloco.match(/^X:(\d+)/m);
    const tMatch = bloco.match(/^T:(.*)$/m);
    if (xMatch) {
      const x = xMatch[1];
      const titulo = tMatch ? tMatch[1].trim() : `Música ${x}`;
      lista.push({ x, titulo, codigo: bloco.trim() });
    }
  });
  return lista;
}

// ============================================================
// 3. RENDERIZAR UMA MÚSICA ESPECÍFICA
// ============================================================
function renderizarMusica(indice) {
  if (!musicas.length || indice < 0 || indice >= musicas.length) return;
  
  musicaSelecionada = indice;
  const musica = musicas[indice];
  const bpm = document.getElementById("tempo").value;

  // Monta o código ABC com o andamento desejado
  let codigo = musica.codigo;
  // Remove Q: antigo se existir
  codigo = codigo.replace(/^Q:.*\n?/gm, "");
  // Insere o Q: após o campo K:
  codigo = codigo.replace(/(K:.*\n)/, `$1Q:${bpm}\n`);

  // Renderiza
  const paperDiv = document.getElementById("paper");
  paperDiv.innerHTML = ""; // limpa

  const visual = ABCJS.renderAbc("paper", codigo, {
    responsive: "resize",
    visualTranspose: transposeValue
  });

  visualObj = visual && visual.length > 0 ? visual[0] : null;

  // Atualiza informações
  document.getElementById("infoMusicaAtual").textContent = 
    `${musica.x} - ${musica.titulo}`;
  document.getElementById("listaMusicas").value = indice;

  // Para qualquer áudio em execução
  stop();
}

// ============================================================
// 4. POPULAR SELECT E FILTRAR
// ============================================================
function popularSelect(filtro = "") {
  const select = document.getElementById("listaMusicas");
  select.innerHTML = "";
  const termo = filtro.toLowerCase().trim();
  const filtradas = musicas.filter(m => 
    m.x.includes(termo) || m.titulo.toLowerCase().includes(termo)
  );
  
  filtradas.forEach((m, idx) => {
    const option = document.createElement("option");
    option.value = musicas.indexOf(m); // índice original
    option.textContent = `${m.x} - ${m.titulo}`;
    select.appendChild(option);
  });

  if (filtradas.length > 0) {
    select.selectedIndex = 0;
    renderizarMusica(parseInt(select.value));
  } else {
    document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada com esse filtro.</p>";
    visualObj = null;
  }
}

// ============================================================
// 5. CARREGAR ARQUIVO
// ============================================================
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";

fetch(file)
  .then(r => {
    if (!r.ok) throw new Error("Arquivo não encontrado");
    return r.text();
  })
  .then(text => {
    abcRawText = text;
    musicas = extrairMusicas(text);
    
    if (musicas.length === 0) {
      document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada no arquivo.</p>";
      return;
    }

    // Mostra navegação
    document.getElementById("navMusicas").style.display = "flex";
    document.getElementById("totalMusicas").textContent = musicas.length;

    // Popula select e renderiza primeira
    popularSelect();

    // Evento de seleção
    document.getElementById("listaMusicas").addEventListener("change", function() {
      renderizarMusica(parseInt(this.value));
    });

    // Busca
    document.getElementById("buscaMusica").addEventListener("input", function() {
      popularSelect(this.value);
    });

    // Anterior / Próximo
    document.getElementById("btnAnterior").addEventListener("click", function() {
      const atual = parseInt(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx > 0) {
        const novoIdx = idx - 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

    document.getElementById("btnProximo").addEventListener("click", function() {
      const atual = parseInt(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx < musicas.length - 1) {
        const novoIdx = idx + 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

  })
  .catch(err => {
    document.getElementById("paper").innerHTML = "<p style='color:red'>Erro ao carregar partitura: " + err.message + "</p>";
  });

// ============================================================
// 6. CONTROLES DE ÁUDIO E TRANSPOSIÇÃO
// ============================================================
function processAndRender() {
  if (musicas.length === 0) return;
  renderizarMusica(musicaSelecionada);
}

document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };
document.getElementById("tempo").oninput = updateUI;

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

async function play(options = {}) {
  if (!visualObj) return;
  stop();

  if (!audioContext) {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
  }

  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();

  try {
    await audioContext.resume();
    
    await synthControl.init({
      visualObj: visualObj,
      audioContext: audioContext,
      millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
      options: {
        qpm: bpm,
        midiTranspose: transposeValue,
        ...options
      }
    });

    await synthControl.prime();
    synthControl.start();
  } catch (e) {
    console.error("Erro no áudio:", e);
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

document.getElementById("play-all").onclick = () => play({});
document.getElementById("play-chords").onclick = () => play({ voicesOff: true });
document.getElementById("play-melodies").onclick = () => play({ chordsOff: true });
document.getElementById("play-v1").onclick = () => play({ chordsOff: true, voicesOff: [1] });
document.getElementById("play-v2").onclick = () => play({ chordsOff: true, voicesOff: [0] });
document.getElementById("stop").onclick = stop;

</script>

</body>
</html>
