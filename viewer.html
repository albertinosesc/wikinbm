<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DP3HN6DMXQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DP3HN6DMXQ');
    </script>

    <meta charset="UTF-8">
    <title>Visualizador NBM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f0f0; text-align: center; }
        .toolbar { background: #2c3e50; color: white; padding: 15px; position: sticky; top: 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; align-items: center; }
        #paper { background: white; max-width: 900px; margin: 20px auto; padding: 30px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .btn { background: #e67e22; border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { width: 50px; padding: 5px; border-radius: 4px; border: none; }
        #audio-player { margin: 10px auto; max-width: 900px; }
    </style>
</head>
<body>

<div class="toolbar">
    <a href="musicas.html" style="color:white; text-decoration:none;">← Voltar</a>
    <div>
        Transpor: <input type="number" id="transpose" value="0" onchange="renderizar()">
    </div>
    <div>
        Andamento: <input type="number" id="tempo" value="1.0" step="0.1" onchange="renderizar()">
    </div>
    <button class="btn" onclick="tocar()">▶ Tocar / Gerar Som</button>
</div>

<div id="audio-player"></div>
<div id="paper"></div>

<script>
    let abcConteudo = "";
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');

    async function carregar() {
        if(!fileUrl) return;
        const resp = await fetch(fileUrl);
        abcConteudo = await resp.text();
        renderizar();
    }

    function renderizar() {
        const trans = parseInt(document.getElementById('transpose').value);
        const scale = parseFloat(document.getElementById('tempo').value);
        
        ABCJS.renderAbc("paper", abcConteudo, {
            responsive: "resize",
            visualTranspose: trans,
            paddingtop: 0,
            paddingbottom: 0
        });
    }

    function tocar() {
        const visualObj = ABCJS.renderAbc("paper", abcConteudo, { visualTranspose: parseInt(document.getElementById('transpose').value) })[0];
        const midiContext = new ABCJS.synth.CreateSynth();
        midiContext.init({ visualObj }).then(() => {
            const synthControl = new ABCJS.synth.SynthController();
            synthControl.load("#audio-player", null, { displayPlay: true, displayRestart: true, displayProgress: true });
            synthControl.setTune(visualObj, false);
        });
    }

    window.onload = carregar;
</script>
</body>
</html>
