<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <style>
    .controls {
      margin: 15px 0;
      padding: 10px;
      background: #eee;
      border-radius: 6px;
    }
    .controls button {
      padding: 6px 12px;
      margin-right: 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html">← Voltar</a>
</nav>

<main>

  <div class="controls" id="audio"></div>

  <div class="controls">
    <strong>Transposição:</strong>
    <button id="down">−</button>
    <span id="transposeValue">0</span>
    <button id="up">+</button>
  </div>

  <div id="paper"></div>

</main>

<script>
let abcText = "";
let transposeValue = 0;
let visualObj;
let synthControl;

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(file)
  .then(r => r.text())
  .then(text => {
    abcText = text;
    render();
  });

function render() {
  document.getElementById("paper").innerHTML = "";
  document.getElementById("audio").innerHTML = "";

  visualObj = ABCJS.renderAbc("paper", abcText, {
    responsive: "resize",
    transpose: transposeValue
  });

  synthControl = new ABCJS.synth.SynthController();
  synthControl.load("#audio", null, {
    displayPlay: true,
    displayStop: true,
    displayProgress: true,
    displayTempo: true   // 👈 CONTROLE DE ANDAMENTO FUNCIONA AQUI
  });

  synthControl.setTune(visualObj[0], false);
}

document.getElementById("up").onclick = () => {
  transposeValue++;
  document.getElementById("transposeValue").textContent = transposeValue;
  render();
};

document.getElementById("down").onclick = () => {
  transposeValue--;
  document.getElementById("transposeValue").textContent = transposeValue;
  render();
};
</script>

</body>
</html>
