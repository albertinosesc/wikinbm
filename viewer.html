<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>🎼 Partitura Interativa</title>



  <link rel="stylesheet" href="style.css">



  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>



  <style>

    .controls {

      margin: 20px 0;

      padding: 10px;

      background: #eee;

      border-radius: 6px;

    }



    .controls label {

      margin-right: 10px;

      font-weight: bold;

    }



    .controls button,

    .controls input {

      margin-right: 10px;

      padding: 5px 10px;

      font-size: 1em;

    }

  </style>

</head>

<body>



<header>

  <h1>🎼 Partitura Interativa</h1>

</header>



<nav>

  <a href="musicas.html">← Voltar</a>

</nav>



<main>



  <div class="controls">

    <button id="play">▶️ Tocar</button>

    <button id="stop">⏹️ Parar</button>



    <label>

      Andamento (BPM):

      <input type="number" id="tempo" value="100" min="40" max="240">

    </label>



    <label>

      Transposição:

      <button id="down">−</button>

      <span id="transposeValue">0</span>

      <button id="up">+</button>

    </label>

  </div>



  <div id="paper"></div>



</main>



<script>

let abcRawText = ""; 

let visualObj = null;

let synthControl = null;

let transposeValue = 0;



// Carregar arquivo

const params = new URLSearchParams(window.location.search);

const file = params.get("file") || "exemplo.abc";



fetch(file)

  .then(r => r.text())

  .then(text => {

    abcRawText = text;

    processAndRender();

  });



function processAndRender() {

  const bpm = document.getElementById("tempo").value;

  

  // 1. Modificar a string ABC para atualizar o campo Q: (Andamento)

  let modifiedAbc = abcRawText.replace(/^Q:.*\n?/gm, ""); 

  modifiedAbc = modifiedAbc.replace(/(K:.*\n)/, `$1Q:${bpm}\n`);



  // 2. Renderizar apenas com visualTranspose (para a partitura)

  visualObj = ABCJS.renderAbc("paper", modifiedAbc, {

    responsive: "resize",

    visualTranspose: transposeValue

  })[0];



  stop();

}



async function play() {

  if (!visualObj) return;

  stop();



  const bpm = parseInt(document.getElementById("tempo").value, 10);

  synthControl = new ABCJS.synth.CreateSynth();



  try {

    await synthControl.init({

      visualObj: visualObj,

      options: {

        qpm: bpm,

        midiTranspose: transposeValue

      }

    });



    await synthControl.prime();

    synthControl.start();

  } catch (e) {

    console.error("Erro no áudio:", e);

  }

}



function stop() {

  if (synthControl) {

    synthControl.stop();

    synthControl = null;

  }

}



document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };

document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };



document.getElementById("tempo").oninput = updateUI;



function updateUI() {

  document.getElementById("transposeValue").textContent = transposeValue;

  processAndRender();

}



document.getElementById("play").onclick = play;

document.getElementById("stop").onclick = stop;

</script>



</body>

</html>
