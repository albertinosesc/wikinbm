<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
    .controls {
      margin: 15px 0;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    button { cursor: pointer; padding: 8px 15px; border: 1px solid #ccc; border-radius: 4px; }
    input[type="number"] { width: 60px; padding: 5px; }
    #paper { background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>

<main>
  <div class="controls">
    <div>
      <button id="play">▶️ Tocar</button>
      <button id="stop">⏹️ Parar</button>
    </div>

    <label>
      <strong>BPM (Q:):</strong>
      <input type="number" id="tempo" value="100" min="40" max="240">
    </label>

    <div>
      <strong>Transpose:</strong>
      <button id="down">−</button>
      <span id="transposeValue" style="min-width: 20px; display: inline-block; text-align: center;">0</span>
      <button id="up">+</button>
    </div>
  </div>

  <div id="paper"></div>
</main>

<script>
let abcRawText = ""; 
let visualObj = null;
let synthControl = null;
let transposeValue = 0;

// Carregar arquivo
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";

fetch(file)
  .then(r => r.text())
  .then(text => {
    abcRawText = text;
    processAndRender();
  });

function processAndRender() {
  const bpm = document.getElementById("tempo").value;
  
  // 1. Modificar a string ABC para atualizar o campo Q: (Andamento)
  // Removemos qualquer linha Q: existente e injetamos a nova
  let modifiedAbc = abcRawText.replace(/^Q:.*\n?/gm, ""); 
  modifiedAbc = modifiedAbc.replace(/(K:.*\n)/, `$1Q:${bpm}\n`);

  // 2. Renderizar com visualTranspose E midiTranspose
  // visualTranspose: muda as notas no papel
  // midiTranspose: muda a nota que o sintetizador toca
  visualObj = ABCJS.renderAbc("paper", modifiedAbc, {
    responsive: "resize",
    visualTranspose: transposeValue,
    midiTranspose: transposeValue 
  })[0];

  // Se o som estiver rolando, para ele para não bugar
  stop();
}

async function play() {
  if (!visualObj) return;
  stop();

  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();

  try {
    await synthControl.init({
      visualObj: visualObj,
      options: {
        // Forçamos o QPM para garantir que o áudio ignore o padrão do arquivo e use o input
        qpm: bpm 
      }
    });

    await synthControl.prime();
    synthControl.start();
  } catch (e) {
    console.error("Erro no áudio:", e);
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

// Eventos de Transposição
document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };

// Evento de Andamento (ao mudar o número, já atualiza o visual)
document.getElementById("tempo").oninput = () => {
  updateUI();
};

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

document.getElementById("play").onclick = play;
document.getElementById("stop").onclick = stop;
</script>

</body>
</html>
