<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <style>
    .controls {
      margin: 15px 0;
      padding: 10px;
      background: #eee;
      border-radius: 6px;
    }
    .controls button,
    .controls input {
      margin-right: 8px;
      padding: 5px 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html">← Voltar</a>
</nav>

<main>

  <div class="controls">
    <button id="play">▶️ Tocar</button>
    <button id="stop">⏹️ Parar</button>

    <label>
      BPM:
      <input type="number" id="tempo" value="100" min="40" max="240">
    </label>

    <label>
      Tom:
      <button id="down">−</button>
      <span id="transposeValue">0</span>
      <button id="up">+</button>
    </label>
  </div>

  <div id="paper"></div>

</main>

<script>
let abcText = "";
let visualObj = null;
let synth = null;
let transposeValue = 0;

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(file)
  .then(r => r.text())
  .then(text => {
    abcText = text;
    renderScore();
  })
  .catch(err => {
    document.getElementById("paper").innerHTML =
      "<p>Erro ao carregar a música.</p>";
  });

function renderScore() {
  document.getElementById("paper").innerHTML = "";

  visualObj = ABCJS.renderAbc("paper", abcText, {
    responsive: "resize",
    transpose: transposeValue
  })[0];
}

async function play() {
  if (!visualObj) return;

  if (synth) synth.stop();

  synth = new ABCJS.synth.CreateSynth();

  const bpm = parseInt(document.getElementById("tempo").value, 10);

  await synth.init({
    visualObj,
    options: {
      tempo: bpm
    }
  });

  await synth.prime();
  synth.start();
}

function stop() {
  if (synth) synth.stop();
}

document.getElementById("play").onclick = play;
document.getElementById("stop").onclick = stop;

document.getElementById("up").onclick = () => {
  transposeValue++;
  document.getElementById("transposeValue").textContent = transposeValue;
  renderScore();
};

document.getElementById("down").onclick = () => {
  transposeValue--;
  document.getElementById("transposeValue").textContent = transposeValue;
  renderScore();
};
</script>

</body>
</html>
