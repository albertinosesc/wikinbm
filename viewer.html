<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DP3HN6DMXQ"></script>
  <script>

  <style>

    .nav-musicas {

    .nav-musicas .titulo-esquerda {

    /* Instrumento MIDI */
    .midi-control {
      display: flex;
      flex-wrap: wrap;

    .modal-overlay {
      display: none;

      top: 0;

    .modal-content table {

    .modal-content .busca-instrumento {

    }
    .modal-content .contador {
      color: #666;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 10px;
    }
    .modal-content .categoria-label {
      background: #e9ecef;
      font-weight: bold;
      color: #2c3e50;
    }
    .modal-content tr:not(.categoria-label) {
      cursor: pointer;
    }
    .modal-content tr:not(.categoria-label):hover {
      background: #d4edda !important;

  </style>

<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html" style="text-decoration: none; font-weight: bold;">← Voltar para o Acervo</a>
</nav>

<main>

  <!-- Navegação entre músicas do arquivo -->
  <div class="nav-musicas" id="navMusicas" style="display:none;">
    <span class="badge" id="totalMusicas">0</span>
    <div class="titulo-esquerda">
      <select id="listaMusicas" size="1"></select>
      <button id="btnAnterior" title="Música anterior">◀</button>
      <button id="btnProximo" title="Próxima música">▶</button>
    </div>
    <span class="info-musica" id="infoMusicaAtual"></span>
    <span class="categoria-info" id="categoriaAtual">📂 Categoria</span>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Andamento (BPM):</label>
      <input type="number" id="tempo" value="100" min="40" max="240" style="width: 60px; padding: 5px;">
      <label style="margin-left:20px;">Transposição:</label>
      <button id="down">−</button>
      <span id="transposeValue" style="font-size: 1.2em; min-width: 20px; text-align: center;">0</span>
      <button id="up">+</button>
    </div>

    <!-- Controle MIDI Program -->
    <div class="control-group midi-control">
      <label>🎹 Instrumento MIDI:</label>
      <input type="number" id="midiProgram" value="0" min="0" max="127">
      <span class="instrument-name" id="instrumentName">Acoustic Grand Piano</span>
      <button onclick="aplicarMIDI()">✅ Aplicar</button>
      <button class="btn-instrumentos" onclick="abrirModalInstrumentos()">📋 Ver Instrumentos</button>
      <span class="info-original" id="infoOriginal"></span>
    </div>

    <div class="control-group audio-modes">
      <label>Tocar:</label>
      <button class="btn-play" id="play-all">Play</button>
      <button id="play-chords">Só Acordes</button>
      <button id="play-melodies">M1 + M2</button>
      <button id="play-v1">Melodia 1</button>
      <button id="play-v2">Melodia 2</button>
      <button class="btn-stop" id="stop">⏹️ Parar</button>
    </div>
  </div>

  <div id="paper"></div>

</main>

<!-- Modal de Instrumentos MIDI -->
<div class="modal-overlay" id="modalInstrumentos">
  <div class="modal-content">
    <button class="fechar" onclick="fecharModalInstrumentos()">✕ Fechar</button>
    <h2>🎹 Tabela General MIDI (0 a 127)</h2>
    <p style="text-align:center; color:#666; font-size:0.9rem;">Clique em um instrumento para selecioná-lo.</p>
    <input type="text" class="busca-instrumento" id="buscaInstrumento" placeholder="🔍 Buscar instrumento..." oninput="filtrarInstrumentos()">
    <div class="contador" id="contadorInstrumentos">Mostrando 128 instrumentos</div>
    <div id="tabelaInstrumentos"></div>
  </div>
</div>

<script>
// ============================================================
// 1. MAPA DE INSTRUMENTOS MIDI (0 a 127) - General MIDI
// ============================================================
const instrumentosMIDI = [
  // Piano (0-7)
  "Acoustic Grand Piano", "Bright Acoustic Piano", "Electric Grand Piano", "Honky-tonk Piano",
  "Electric Piano 1 (Rhodes)", "Electric Piano 2 (Chorused)", "Harpsichord (Cravo)", "Clavinet",
  // Chromatic Percussion (8-15)
  "Celesta", "Glockenspiel", "Music Box (Caixinha)", "Vibraphone",
  "Marimba", "Xylophone", "Tubular Bells", "Dulcimer",
  // Organ (16-23)
  "Drawbar Organ", "Percussive Organ", "Rock Organ", "Church Organ (Tubos)",
  "Reed Organ", "Accordion", "Harmonica (Gaita)", "Tango Accordion",
  // Guitar (24-31)
  "Acoustic Guitar (Nylon)", "Acoustic Guitar (Steel)", "Electric Guitar (Jazz)", "Electric Guitar (Clean)",
  "Electric Guitar (Muted)", "Overdriven Guitar", "Distortion Guitar", "Guitar Harmonics",
  // Bass (32-39)
  "Acoustic Bass", "Electric Bass (Finger)", "Electric Bass (Pick)", "Fretless Bass",
  "Slap Bass 1", "Slap Bass 2", "Synth Bass 1", "Synth Bass 2",
  // Strings (40-47)
  "Violin", "Viola", "Cello", "Contrabass",
  "Tremolo Strings", "Pizzicato Strings", "Orchestral Harp", "Timpani",
  // Ensemble (48-55)
  "String Ensemble 1", "String Ensemble 2", "Synth Strings 1", "Synth Strings 2",
  "Choir Aahs", "Voice Oohs", "Synth Voice", "Orchestra Hit",
  // Brass (56-63)
  "Trumpet", "Trombone", "Tuba", "Muted Trumpet",
  "French Horn (Trompa)", "Brass Section", "Synth Brass 1", "Synth Brass 2",
  // Reed (64-71)
  "Soprano Sax", "Alto Sax", "Tenor Sax", "Baritone Sax",
  "Oboe", "English Horn", "Bassoon (Fagote)", "Clarinet",
  // Pipe (72-79)
  "Piccolo", "Flute", "Recorder (Flauta Doce)", "Pan Flute",
  "Blown Bottle", "Shakuhachi", "Whistle (Apito)", "Ocarina",
  // Synth Lead (80-87)
  "Lead 1 (Square)", "Lead 2 (Sawtooth)", "Lead 3 (Calliope)", "Lead 4 (Chiff)",
  "Lead 5 (Charang)", "Lead 6 (Voice)", "Lead 7 (Fifths)", "Lead 8 (Bass+Lead)",
  // Synth Pad (88-95)
  "Pad 1 (New Age)", "Pad 2 (Warm)", "Pad 3 (Polysynth)", "Pad 4 (Choir)",
  "Pad 5 (Bowed)", "Pad 6 (Metallic)", "Pad 7 (Halo)", "Pad 8 (Sweep)",
  // Synth Effects (96-103)
  "FX 1 (Rain)", "FX 2 (Soundtrack)", "FX 3 (Crystal)", "FX 4 (Atmosphere)",
  "FX 5 (Brightness)", "FX 6 (Goblins)", "FX 7 (Echoes)", "FX 8 (Sci-fi)",
  // Ethnic (104-111)
  "Sitar", "Banjo", "Shamisen", "Koto",
  "Kalimba", "Bagpipe (Gaita de Foles)", "Fiddle (Rabeca)", "Shanai",
  // Percussive (112-119)
  "Tinkle Bell", "Agogo", "Steel Drums", "Woodblock",
  "Taiko Drum", "Melodic Tom", "Synth Drum", "Reverse Cymbal",
  // Sound Effects (120-127)
  "Guitar Fret Noise", "Breath Noise", "Seashore (Mar)", "Bird Tweet",
  "Telephone Ring", "Helicopter", "Applause (Palmas)", "Gunshot"
];

// Categorias para exibição
const categorias = [
  { inicio: 0, fim: 7, nome: "🎹 Piano" },
  { inicio: 8, fim: 15, nome: "🔔 Chromatic Percussion" },
  { inicio: 16, fim: 23, nome: "🎵 Organ" },
  { inicio: 24, fim: 31, nome: "🎸 Guitar" },
  { inicio: 32, fim: 39, nome: "🎸 Bass" },
  { inicio: 40, fim: 47, nome: "🎻 Strings" },
  { inicio: 48, fim: 55, nome: "🎻 Ensemble" },
  { inicio: 56, fim: 63, nome: "🎺 Brass" },
  { inicio: 64, fim: 71, nome: "🎷 Reed" },
  { inicio: 72, fim: 79, nome: "🎵 Pipe" },
  { inicio: 80, fim: 87, nome: "🎹 Synth Lead" },
  { inicio: 88, fim: 95, nome: "🎹 Synth Pad" },
  { inicio: 96, fim: 103, nome: "🔊 Synth Effects" },
  { inicio: 104, fim: 111, nome: "🌍 Ethnic" },
  { inicio: 112, fim: 119, nome: "🥁 Percussive" },
  { inicio: 120, fim: 127, nome: "🎬 Sound Effects" }
];

function getCategoria(num) {
  for (const cat of categorias) {
    if (num >= cat.inicio && num <= cat.fim) {
      return cat.nome;
    }
  }
  return '';
}

function getInstrumentName(program) {
  if (program >= 0 && program < instrumentosMIDI.length) {
    return instrumentosMIDI[program];
  }
  return `Programa ${program}`;
}

// Atualiza o nome do instrumento quando o número muda
document.getElementById('midiProgram').addEventListener('input', function() {
  const val = parseInt(this.value);
  if (!isNaN(val) && val >= 0 && val <= 127) {
    document.getElementById('instrumentName').textContent = getInstrumentName(val);
  } else {
    document.getElementById('instrumentName').textContent = 'Acoustic Grand Piano (padrão)';
  }
});

// ============================================================
// 2. VARIÁVEIS GLOBAIS
// ============================================================
let musicas = [];
let musicaSelecionada = 0;
let visualObj = null;
let synthControl = null;
let transposeValue = 0;
let audioContext = null;
let midiOriginal = null;
let categoriaAtual = '';

// ============================================================
// 3. FUNÇÕES AUXILIARES
// ============================================================
function extrairCampo(bloco, campo) {
  const regex = new RegExp('^' + campo + ':(.*)$', 'm');
  const match = bloco.match(regex);
  return match ? match[1].trim() : '';
}

function limparTitulo(x, titulo) {
  const padrao = new RegExp('^' + x.padStart(3, '0') + '\\s*[-–]\\s*');
  const padraoSemZero = new RegExp('^' + x + '\\s*[-–]\\s*');
  let limpo = titulo;
  if (padrao.test(titulo)) limpo = titulo.replace(padrao, '');
  else if (padraoSemZero.test(titulo)) limpo = titulo.replace(padraoSemZero, '');
  return limpo;
}

// ============================================================
// 4. EXTRAIR MÚSICAS DO ARQUIVO ABC
// ============================================================
function extrairMusicas(texto) {
  const blocos = texto.split(/\n(?=X:\d+)/);
  const lista = [];
  let categoriaTemp = '';
  
  blocos.forEach(bloco => {
    const x = extrairCampo(bloco, 'X');
    if (!x) return;
    const tituloRaw = extrairCampo(bloco, 'T') || `Música ${x}`;
    const compositor = extrairCampo(bloco, 'C') || 
                       extrairCampo(bloco, 'O') || 
                       extrairCampo(bloco, 'S') || 
                       'Desconhecido';
    const tituloLimpo = limparTitulo(x, tituloRaw);
    
    // Verifica se já tem %%MIDI program
    const midiMatch = bloco.match(/^%%MIDI\s+program\s+(\d+)/m);
    const midiProgram = midiMatch ? parseInt(midiMatch[1], 10) : null;
    
    // Tenta extrair categoria do campo S: ou O:
    const categoria = extrairCampo(bloco, 'S') || extrairCampo(bloco, 'O') || 'Músicas';
    
    lista.push({
      x: x,
      titulo: `${x} - ${tituloLimpo}`,
      tituloLimpo: tituloLimpo,
      compositor: compositor,
      codigo: bloco.trim(),
      midiProgram: midiProgram,
      categoria: categoria
    });
  });
  lista.sort((a, b) => parseInt(a.x, 10) - parseInt(b.x, 10));
  return lista;
}

// ============================================================
// 5. RENDERIZAR UMA MÚSICA ESPECÍFICA
// ============================================================
function renderizarMusica(indice) {
  if (!musicas.length || indice < 0 || indice >= musicas.length) return;
  musicaSelecionada = indice;
  const musica = musicas[indice];
  const bpm = document.getElementById("tempo").value;

  let codigo = musica.codigo;

  // --- TRATAMENTO DO Q: (ANDAMENTO) ---
  const hasQ = /^Q:.*/m.test(codigo);
  if (!hasQ) {
    codigo = codigo.replace(/^Q:.*$/gm, "");
    codigo = codigo.replace(/^\s*[\r\n]/gm, "");
    const kMatch = codigo.match(/^(K:.*)$/m);
    if (kMatch) {
      codigo = codigo.replace(/^(K:.*)$/m, `$1\nQ:${bpm}`);
    } else {
      const tMatch = codigo.match(/^(T:.*)$/m);
      if (tMatch) {
        codigo = codigo.replace(/^(T:.*)$/m, `$1\nQ:${bpm}`);
      } else {
        codigo = `Q:${bpm}\n` + codigo;
      }
    }
  }

  // --- TRATAMENTO DO %%MIDI program ---
  // Remove qualquer %%MIDI program existente
  codigo = codigo.replace(/^%%MIDI\s+program\s+\d+.*$/gm, "");
  codigo = codigo.replace(/^\s*[\r\n]/gm, "");

  // Pega o valor do campo MIDI (se inválido, usa o valor atual ou 0)
  let midiVal = parseInt(document.getElementById('midiProgram').value);
  if (isNaN(midiVal) || midiVal < 0 || midiVal > 127) {
    midiVal = 0;
    document.getElementById('midiProgram').value = 0;
    document.getElementById('instrumentName').textContent = 'Acoustic Grand Piano';
  }

  // Insere o %%MIDI program
  const kMatch2 = codigo.match(/^(K:.*)$/m);
  if (kMatch2) {
    codigo = codigo.replace(/^(K:.*)$/m, `$1\n%%MIDI program ${midiVal}`);
  } else {
    const qMatch = codigo.match(/^(Q:.*)$/m);
    if (qMatch) {
      codigo = codigo.replace(/^(Q:.*)$/m, `$1\n%%MIDI program ${midiVal}`);
    } else {
      codigo = `%%MIDI program ${midiVal}\n` + codigo;
    }
  }

  // Renderiza
  const paperDiv = document.getElementById("paper");
  paperDiv.innerHTML = "";

  const visual = ABCJS.renderAbc("paper", codigo, {
    responsive: "resize",
    visualTranspose: transposeValue
  });

  visualObj = visual && visual.length > 0 ? visual[0] : null;

  // Atualiza informações - título e categoria
  document.getElementById("categoriaAtual").textContent = `${musica.categoria}`;
  document.getElementById("listaMusicas").value = indice;

  // Atualiza o campo MIDI com o valor da música
  if (musica.midiProgram !== null && musica.midiProgram !== undefined) {
    document.getElementById('midiProgram').value = musica.midiProgram;
    document.getElementById('instrumentName').textContent = getInstrumentName(musica.midiProgram);
    document.getElementById('infoOriginal').textContent = `(Original: ${musica.midiProgram} - ${getInstrumentName(musica.midiProgram)})`;
    midiOriginal = musica.midiProgram;
  } else {
    // Se não tem MIDI, mantém o valor atual ou 0
    if (midiOriginal === null) {
      // Não sobrescreve o valor se o usuário já escolheu um
      if (!document.getElementById('midiProgram').value || document.getElementById('midiProgram').value === '0') {
        document.getElementById('midiProgram').value = 0;
        document.getElementById('instrumentName').textContent = 'Acoustic Grand Piano';
        document.getElementById('infoOriginal').textContent = '(Sem instrumento definido - Piano padrão)';
      }
    }
  }

  stop();
}

// ============================================================
// 6. APLICAR MIDI (CONFIRMAR SELEÇÃO)
// ============================================================
function aplicarMIDI() {
  if (musicas.length === 0) return;
  let val = parseInt(document.getElementById('midiProgram').value);
  if (isNaN(val) || val < 0 || val > 127) {
    val = 0;
    document.getElementById('midiProgram').value = 0;
    document.getElementById('instrumentName').textContent = 'Acoustic Grand Piano';
  }
  document.getElementById('instrumentName').textContent = getInstrumentName(val);
  // Re-renderiza a música atual com o novo MIDI
  renderizarMusica(musicaSelecionada);
  // Mostra feedback visual
  const btn = document.querySelector('.midi-control button:first-of-type');
  const originalText = btn.textContent;
  btn.textContent = '✅ Aplicado!';
  btn.style.background = '#28a745';
  setTimeout(() => {
    btn.textContent = originalText;
    btn.style.background = '#28a745';
  }, 1500);
}

// ============================================================
// 7. MODAL DE INSTRUMENTOS
// ============================================================
function abrirModalInstrumentos() {
  const modal = document.getElementById('modalInstrumentos');
  modal.style.display = 'flex';
  gerarTabelaInstrumentos('');
}

function fecharModalInstrumentos() {
  document.getElementById('modalInstrumentos').style.display = 'none';
}

function gerarTabelaInstrumentos(filtro) {
  const container = document.getElementById('tabelaInstrumentos');
  const termo = filtro.toLowerCase().trim();
  let html = '<table>';
  html += '<tr><th>Nº</th><th>Instrumento</th><th>Categoria</th></tr>';
  
  let count = 0;
  let ultimaCategoria = '';
  for (let i = 0; i < instrumentosMIDI.length; i++) {
    const nome = instrumentosMIDI[i];
    const cat = getCategoria(i);
    if (termo === '' || nome.toLowerCase().includes(termo) || i.toString().includes(termo)) {
      if (cat !== ultimaCategoria) {
        ultimaCategoria = cat;
        html += `<tr class="categoria-label"><td colspan="3">${cat}</td></tr>`;
      }
      const destaque = i === parseInt(document.getElementById('midiProgram').value) ? 'destaque' : '';
      html += `<tr class="${destaque}" data-midi="${i}"><td><strong>${i}</strong></td><td>${nome}</td><td style="font-size:0.75rem;color:#888;">${cat}</td></tr>`;
      count++;
    }
  }
  html += '</table>';
  container.innerHTML = html;
  document.getElementById('contadorInstrumentos').textContent = `Mostrando ${count} de ${instrumentosMIDI.length} instrumentos`;
  
  // Se clicar em uma linha (exceto cabeçalho de categoria), preenche o campo
  container.querySelectorAll('tr:not(.categoria-label)').forEach(tr => {
    tr.addEventListener('click', function() {
      const num = parseInt(this.dataset.midi);
      if (!isNaN(num)) {
        // Preenche o campo MIDI com o número selecionado
        document.getElementById('midiProgram').value = num;
        document.getElementById('instrumentName').textContent = getInstrumentName(num);
        fecharModalInstrumentos();
        // Aplica automaticamente ao clicar na tabela
        aplicarMIDI();
      }
    });
  });
}

function filtrarInstrumentos() {
  const filtro = document.getElementById('buscaInstrumento').value;
  gerarTabelaInstrumentos(filtro);
}

// Fecha o modal se clicar fora
window.onclick = function(event) {
  const modal = document.getElementById('modalInstrumentos');
  if (event.target === modal) {
    modal.style.display = 'none';
  }
}

// ============================================================
// 8. POPULAR SELECT
// ============================================================
function popularSelect(selecionarNum = null) {
  const select = document.getElementById("listaMusicas");
  select.innerHTML = "";
  
  musicas.forEach((m) => {
    const option = document.createElement("option");
    option.value = musicas.indexOf(m);
    const midiInfo = m.midiProgram !== null ? ` 🎹${m.midiProgram}` : '';
    option.textContent = `${m.x} - ${m.tituloLimpo} (${m.compositor})${midiInfo}`;
    select.appendChild(option);
  });

  if (musicas.length === 0) {
    document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada no arquivo.</p>";
    visualObj = null;
    return;
  }

  let idxSelecionado = 0;
  if (selecionarNum) {
    const encontrado = musicas.findIndex(m => m.x === selecionarNum);
    if (encontrado !== -1) {
      idxSelecionado = encontrado;
    }
  }
  select.selectedIndex = idxSelecionado;
  renderizarMusica(Number(select.value));
}

// ============================================================
// 9. CARREGAR ARQUIVO
// ============================================================
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";
const numParam = params.get("num") || null;

fetch(file)
  .then(r => {
    if (!r.ok) throw new Error("Arquivo não encontrado");
    return r.text();
  })
  .then(text => {
    musicas = extrairMusicas(text);
    if (musicas.length === 0) {
      document.getElementById("paper").innerHTML = "<p style='color:red;'>Nenhuma música encontrada no arquivo.</p>";
      return;
    }

    document.getElementById("navMusicas").style.display = "flex";
    document.getElementById("totalMusicas").textContent = musicas.length;

    popularSelect(numParam);

    document.getElementById("listaMusicas").addEventListener("change", function() {
      renderizarMusica(Number(this.value));
    });

    document.getElementById("btnAnterior").addEventListener("click", function() {
      const atual = Number(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx > 0) {
        const novoIdx = idx - 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

    document.getElementById("btnProximo").addEventListener("click", function() {
      const atual = Number(document.getElementById("listaMusicas").value);
      const idx = musicas.findIndex((_, i) => i === atual);
      if (idx < musicas.length - 1) {
        const novoIdx = idx + 1;
        document.getElementById("listaMusicas").value = novoIdx;
        renderizarMusica(novoIdx);
      }
    });

  })
  .catch(err => {
    document.getElementById("paper").innerHTML = "<p style='color:red'>Erro ao carregar partitura: " + err.message + "</p>";
  });

// ============================================================
// 10. CONTROLES DE ÁUDIO E TRANSPOSIÇÃO
// ============================================================
function processAndRender() {
  if (musicas.length === 0) return;
  renderizarMusica(musicaSelecionada);
}

document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };
document.getElementById("tempo").oninput = updateUI;

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

async function play(options = {}) {
  if (!visualObj) return;
  stop();
  if (!audioContext) {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
  }
  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();
  try {
    await audioContext.resume();
    await synthControl.init({
      visualObj: visualObj,
      audioContext: audioContext,
      millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
      options: {
        qpm: bpm,
        midiTranspose: transposeValue,
        ...options
      }
    });
    await synthControl.prime();
    synthControl.start();
  } catch (e) {
    console.error("Erro no áudio:", e);
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

document.getElementById("play-all").onclick = () => play({});
document.getElementById("play-chords").onclick = () => play({ voicesOff: true });
document.getElementById("play-melodies").onclick = () => play({ chordsOff: true });
document.getElementById("play-v1").onclick = () => play({ chordsOff: true, voicesOff: [1] });
document.getElementById("play-v2").onclick = () => play({ chordsOff: true, voicesOff: [0] });
document.getElementById("stop").onclick = stop;
</script>
