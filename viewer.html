<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <style>
    .controls {
      margin: 20px 0;
      padding: 10px;
      background: #eee;
      border-radius: 6px;
    }

    .controls label {
      margin-right: 10px;
      font-weight: bold;
    }

    .controls button,
    .controls input {
      margin-right: 10px;
      padding: 5px 10px;
      font-size: 1em;
    }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html">← Voltar</a>
</nav>

<main>

  <div class="controls">
    <button id="play">▶️ Tocar</button>
    <button id="stop">⏹️ Parar</button>

    <label>
      Andamento (BPM):
      <input type="number" id="tempo" value="100" min="40" max="240">
    </label>

    <label>
      Transposição:
      <button id="down">−</button>
      <span id="transposeValue">0</span>
      <button id="up">+</button>
    </label>
  </div>

  <div id="paper"></div>

</main>

<script>
let originalAbc = "";
let transposeValue = 0;
let tempoValue = 100;
let synth = null;
let visualObj = null;

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

fetch(file)
  .then(r => r.text())
  .then(abc => {
    originalAbc = abc;
    render();
  });

function render() {
  let abc = originalAbc;

  // Remove Q existente
  abc = abc.replace(/^Q:.*$/m, "");

  // Insere novo andamento
  abc = abc.replace(/(L:.*\n)/, `$1Q:1/4=${tempoValue}\n`);

  document.getElementById("paper").innerHTML = "";

  visualObj = ABCJS.renderAbc("paper", abc, {
    transpose: transposeValue
  })[0];
}

async function play() {
  if (synth) synth.stop();

  synth = new ABCJS.synth.CreateSynth();
  await synth.init({ visualObj });
  await synth.prime();
  synth.start();
}

function stop() {
  if (synth) synth.stop();
}

document.getElementById("play").onclick = play;
document.getElementById("stop").onclick = stop;

document.getElementById("tempo").onchange = e => {
  tempoValue = parseInt(e.target.value, 10);
  render();
};

document.getElementById("up").onclick = () => {
  transposeValue++;
  document.getElementById("transposeValue").textContent = transposeValue;
  render();
};

document.getElementById("down").onclick = () => {
  transposeValue--;
  document.getElementById("transposeValue").textContent = transposeValue;
  render();
};
</script>


</body>
</html>
