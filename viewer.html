<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🎼 Partitura Interativa</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DP3HN6DMXQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DP3HN6DMXQ');
  </script>

  <style>
    .controls { margin: 20px 0; padding: 15px; background: #f4f4f4; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .control-group { margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .audio-modes { border-top: 1px solid #ddd; padding-top: 15px; margin-top: 10px; }
    .controls label { font-weight: bold; }
    .controls button { cursor: pointer; padding: 8px 12px; border: 1px solid #ccc; background: white; border-radius: 4px; transition: all 0.2s; }
    .controls button:hover { background: #e9e9e9; }
    .btn-play { background-color: #e7f3ff !important; border-color: #007bff !important; color: #007bff; font-weight: bold; }
    .btn-stop { background-color: #fff0f0 !important; border-color: #dc3545 !important; color: #dc3545; font-weight: bold; }
    #paper { background: white; padding: 10px; margin-top: 20px; border-radius: 8px; }
    #navegacao { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    #navegacao select { padding: 5px; font-size: 1rem; }
    #navegacao button { padding: 6px 12px; }
    .ativo { background: #007bff; color: white; border-color: #007bff; }
  </style>
</head>
<body>

<header>
  <h1>🎼 Partitura Interativa</h1>
</header>

<nav>
  <a href="musicas.html" style="text-decoration: none; font-weight: bold;">← Voltar para o Acervo</a>
</nav>

<main>

  <div class="controls">
    <!-- Navegação entre músicas -->
    <div id="navegacao">
      <button id="btnPrev">◀ Anterior</button>
      <span>Música: <select id="selectMusica"></select></span>
      <button id="btnNext">Próxima ▶</button>
      <button id="btnMostrarTodas" class="ativo">📚 Mostrar Todas</button>
    </div>

    <div class="control-group">
      <label>Andamento (BPM):</label>
      <input type="number" id="tempo" value="100" min="40" max="240" style="width: 60px; padding: 5px;">

      <label style="margin-left:20px;">Transposição:</label>
      <button id="down">−</button>
      <span id="transposeValue" style="font-size: 1.2em; min-width: 20px; text-align: center;">0</span>
      <button id="up">+</button>
    </div>

    <div class="control-group audio-modes">
      <label>Tocar:</label>
      <button class="btn-play" id="play-all">Play</button>
      <button id="play-chords">Só Acordes</button>
      <button id="play-melodies">M1 + M2</button>
      <button id="play-v1">Melodia 1</button>
      <button id="play-v2">Melodia 2</button>
      <button class="btn-stop" id="stop">⏹️ Parar</button>
    </div>
  </div>

  <div id="paper"></div>

</main>

<script>
let abcRawText = "";
let visualObj = null;
let synthControl = null;
let transposeValue = 0;
let audioContext = null;
let musicas = []; // Array de objetos { titulo, abc }
let indiceAtual = 0;
let modoTodas = true; // true = mostra todas, false = mostra apenas a selecionada

// 1. Carregar arquivo via URL
const params = new URLSearchParams(window.location.search);
const file = params.get("file") || "exemplo.abc";

fetch(file)
  .then(r => {
    if(!r.ok) throw new Error("Arquivo não encontrado");
    return r.text();
  })
  .then(text => {
    abcRawText = text;
    // Divide o arquivo em blocos por X:
    const blocos = text.split(/\n(?=X:\d+)/).filter(b => b.trim() !== '');
    if (blocos.length === 0) {
      document.getElementById("paper").innerHTML = "<p>Nenhuma música encontrada.</p>";
      return;
    }
    // Para cada bloco, extrai título e número
    musicas = blocos.map((bloco, idx) => {
      const tituloMatch = bloco.match(/^T:(.*)$/m);
      const xMatch = bloco.match(/^X:(\d+)/m);
      const titulo = tituloMatch ? tituloMatch[1].trim() : `Música ${idx+1}`;
      const numero = xMatch ? xMatch[1] : (idx+1).toString();
      return { numero, titulo, abc: bloco };
    });

    // Verifica se tem parâmetro index na URL (ex: ?file=...&index=1) - 0-based
    const indexParam = params.get("index");
    if (indexParam !== null && !isNaN(indexParam) && indexParam >= 0 && indexParam < musicas.length) {
      indiceAtual = parseInt(indexParam, 10);
      modoTodas = false;
      document.getElementById('btnMostrarTodas').classList.remove('ativo');
    } else {
      modoTodas = true;
      document.getElementById('btnMostrarTodas').classList.add('ativo');
    }

    // Preenche o select com os títulos
    const select = document.getElementById('selectMusica');
    select.innerHTML = '';
    musicas.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${m.numero} - ${m.titulo}`;
      select.appendChild(opt);
    });
    select.value = indiceAtual;
    select.addEventListener('change', (e) => {
      indiceAtual = parseInt(e.target.value, 10);
      modoTodas = false;
      document.getElementById('btnMostrarTodas').classList.remove('ativo');
      processAndRender();
    });

    // Botões navegação
    document.getElementById('btnPrev').addEventListener('click', () => {
      if (musicas.length === 0) return;
      indiceAtual = (indiceAtual - 1 + musicas.length) % musicas.length;
      modoTodas = false;
      document.getElementById('btnMostrarTodas').classList.remove('ativo');
      select.value = indiceAtual;
      processAndRender();
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      if (musicas.length === 0) return;
      indiceAtual = (indiceAtual + 1) % musicas.length;
      modoTodas = false;
      document.getElementById('btnMostrarTodas').classList.remove('ativo');
      select.value = indiceAtual;
      processAndRender();
    });
    document.getElementById('btnMostrarTodas').addEventListener('click', () => {
      modoTodas = true;
      document.getElementById('btnMostrarTodas').classList.add('ativo');
      processAndRender();
    });

    processAndRender();
  })
  .catch(err => {
    document.getElementById("paper").innerHTML = "<p style='color:red'>Erro ao carregar partitura: " + err.message + "</p>";
  });

function processAndRender() {
  const bpm = document.getElementById("tempo").value;
  const paper = document.getElementById("paper");
  paper.innerHTML = '';

  if (musicas.length === 0) {
    paper.innerHTML = "<p>Nenhuma música disponível.</p>";
    return;
  }

  // Seleciona o(s) bloco(s) a renderizar
  let blocosParaRenderizar = [];
  if (modoTodas) {
    blocosParaRenderizar = musicas.map(m => m.abc);
  } else {
    blocosParaRenderizar = [musicas[indiceAtual].abc];
  }

  // Junta os blocos em um único texto
  let textoABC = blocosParaRenderizar.join('\n');

  // Aplica andamento e transposição
  let modifiedAbc = textoABC.replace(/^Q:.*\n?/gm, "");
  modifiedAbc = modifiedAbc.replace(/(K:.*\n)/, `$1Q:${bpm}\n`);

  // Renderização
  const visualObjs = ABCJS.renderAbc("paper", modifiedAbc, {
    responsive: "resize",
    visualTranspose: transposeValue
  });

  // Guarda o primeiro objeto para áudio (se houver)
  if (visualObjs && visualObjs.length > 0) {
    visualObj = visualObjs[0];
  } else {
    visualObj = null;
  }

  stop();
}

// ===== ÁUDIO (mesmo de antes) =====
async function play(options = {}) {
  if (!visualObj) return;
  stop();

  if (!audioContext) {
    window.AudioContext = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContext();
  }

  const bpm = parseInt(document.getElementById("tempo").value, 10);
  synthControl = new ABCJS.synth.CreateSynth();

  try {
    await audioContext.resume();
    await synthControl.init({
      visualObj: visualObj,
      audioContext: audioContext,
      millisecondsPerMeasure: visualObj.millisecondsPerMeasure(),
      options: {
        qpm: bpm,
        midiTranspose: transposeValue,
        ...options
      }
    });
    await synthControl.prime();
    synthControl.start();
  } catch (e) {
    console.error("Erro no áudio:", e);
  }
}

function stop() {
  if (synthControl) {
    synthControl.stop();
    synthControl = null;
  }
}

// Eventos de Transposição
document.getElementById("up").onclick = () => { transposeValue++; updateUI(); };
document.getElementById("down").onclick = () => { transposeValue--; updateUI(); };
document.getElementById("tempo").oninput = updateUI;

function updateUI() {
  document.getElementById("transposeValue").textContent = transposeValue;
  processAndRender();
}

// Mapeamento dos Botões de Áudio
document.getElementById("play-all").onclick = () => play({});
document.getElementById("play-chords").onclick = () => play({ voicesOff: true });
document.getElementById("play-melodies").onclick = () => play({ chordsOff: true });
document.getElementById("play-v1").onclick = () => play({ chordsOff: true, voicesOff: [1] });
document.getElementById("play-v2").onclick = () => play({ chordsOff: true, voicesOff: [0] });
document.getElementById("stop").onclick = stop;
</script>

</body>
</html>
